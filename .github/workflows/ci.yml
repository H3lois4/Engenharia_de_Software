name: CI/CD

# Roda em pushs e PRs na main. O deploy (publicação) só acontece em push na main
# e somente depois que lint, testes e verificação de dependências passam.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela execuções antigas do mesmo ref para economizar minutos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1) Linting + testes do BFF (Python)
  # ---------------------------------------------------------------------------
  backend:
    name: BFF — lint e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Formatação (ruff format)
        run: ruff format --check .

      - name: Testes (pytest)
        run: pytest -q

  # ---------------------------------------------------------------------------
  # 2) Linting + testes + build do portal (React/TypeScript)
  # ---------------------------------------------------------------------------
  frontend:
    name: Portal — lint, testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Checagem de tipos (tsc)
        run: npm run typecheck

      - name: Testes (vitest)
        run: npm test

      - name: Build de produção
        run: npm run build

  # ---------------------------------------------------------------------------
  # 3) Verificação de dependências (vulnerabilidades)
  #    Complementa o Dependabot com uma checagem a cada push/PR.
  # ---------------------------------------------------------------------------
  dependencias:
    name: Verificação de dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Auditar dependências do BFF (pip-audit)
        run: |
          pip install pip-audit
          pip install -e ./backend
          pip-audit --progress-spinner off || true

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Auditar dependências do portal (npm audit)
        working-directory: frontend
        run: npm audit --audit-level=high || true

  # ---------------------------------------------------------------------------
  # 4) Build e publicação das imagens Docker no GitHub Container Registry (GHCR)
  #    Só em push na main e só se TODOS os jobs acima passarem.
  # ---------------------------------------------------------------------------
  build-images:
    name: Build e push das imagens (GHCR)
    runs-on: ubuntu-latest
    needs: [backend, frontend, dependencias]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    env:
      # URLs públicas reais no Azure (o Azure adiciona sufixo e usa domínio regional)
      BFF_URL: https://ms-dashboard-bff-heloisa-f7haargthjfcbwdj.brazilsouth-01.azurewebsites.net
      WEB_URL: https://ms-dashboard-web-heloisa-g0eqdmgufyb4dtd5.brazilsouth-01.azurewebsites.net
    steps:
      - uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir nome do repositório em minúsculas
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build e push do BFF
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/bff:latest
            ghcr.io/${{ steps.repo.outputs.name }}/bff:${{ github.sha }}

      - name: Build e push do portal
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ env.BFF_URL }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/web:latest
            ghcr.io/${{ steps.repo.outputs.name }}/web:${{ github.sha }}

  # ---------------------------------------------------------------------------
  # 5) Deploy nos Azure App Services (containers)
  # ---------------------------------------------------------------------------
  deploy:
    name: Publicação (Azure App Services)
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # secrets não podem ser usados direto em `if:`; mapeamos para env no nível do job.
    env:
      PROFILE_BFF: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_BFF }}
      PROFILE_WEB: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_WEB }}
    steps:
      - name: Definir nome do repositório em minúsculas
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Deploy do BFF
        if: ${{ env.PROFILE_BFF != '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ms-dashboard-bff-heloisa
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_BFF }}
          images: ghcr.io/${{ steps.repo.outputs.name }}/bff:${{ github.sha }}

      - name: Deploy do portal
        if: ${{ env.PROFILE_WEB != '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ms-dashboard-web-heloisa
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_WEB }}
          images: ghcr.io/${{ steps.repo.outputs.name }}/web:${{ github.sha }}

      - name: Aviso se os publish profiles não estiverem configurados
        if: ${{ env.PROFILE_BFF == '' && env.PROFILE_WEB == '' }}
        run: |
          echo "::warning::Publish profiles do Azure ausentes. Cadastre os secrets"
          echo "AZURE_WEBAPP_PUBLISH_PROFILE_BFF e AZURE_WEBAPP_PUBLISH_PROFILE_WEB."
