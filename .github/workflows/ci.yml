name: CI/CD

# Roda em pushs e PRs na main. O deploy (publicação) só acontece em push na main
# e somente depois que lint, testes e verificação de dependências passam.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela execuções antigas do mesmo ref para economizar minutos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1) Linting + testes do BFF (Python)
  # ---------------------------------------------------------------------------
  backend:
    name: BFF — lint e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Formatação (ruff format)
        run: ruff format --check .

      - name: Testes (pytest)
        run: pytest -q

  # ---------------------------------------------------------------------------
  # 2) Linting + testes + build do portal (React/TypeScript)
  # ---------------------------------------------------------------------------
  frontend:
    name: Portal — lint, testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Checagem de tipos (tsc)
        run: npm run typecheck

      - name: Testes (vitest)
        run: npm test

      - name: Build de produção
        run: npm run build

  # ---------------------------------------------------------------------------
  # 3) Verificação de dependências (vulnerabilidades)
  #    Complementa o Dependabot com uma checagem a cada push/PR.
  # ---------------------------------------------------------------------------
  dependencias:
    name: Verificação de dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Auditar dependências do BFF (pip-audit)
        run: |
          pip install pip-audit
          pip install -e ./backend
          pip-audit --progress-spinner off || true

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Auditar dependências do portal (npm audit)
        working-directory: frontend
        run: npm audit --audit-level=high || true

  # ---------------------------------------------------------------------------
  # 4) Publicação automática (deploy no Render)
  #    Só em push na main e só se TODOS os jobs acima passarem.
  # ---------------------------------------------------------------------------
  deploy:
    name: Publicação (deploy no Render)
    runs-on: ubuntu-latest
    needs: [backend, frontend, dependencias]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      RENDER_DEPLOY_HOOK_BFF: ${{ secrets.RENDER_DEPLOY_HOOK_BFF }}
      RENDER_DEPLOY_HOOK_WEB: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
    steps:
      - name: Disparar deploy do BFF
        if: ${{ env.RENDER_DEPLOY_HOOK_BFF != '' }}
        run: curl -fsS "$RENDER_DEPLOY_HOOK_BFF"

      - name: Disparar deploy do portal
        if: ${{ env.RENDER_DEPLOY_HOOK_WEB != '' }}
        run: curl -fsS "$RENDER_DEPLOY_HOOK_WEB"

      - name: Aviso se os hooks não estiverem configurados
        if: ${{ env.RENDER_DEPLOY_HOOK_BFF == '' && env.RENDER_DEPLOY_HOOK_WEB == '' }}
        run: |
          echo "::warning::Nenhum Deploy Hook configurado. Cadastre os secrets"
          echo "RENDER_DEPLOY_HOOK_BFF e RENDER_DEPLOY_HOOK_WEB para publicar automaticamente."
