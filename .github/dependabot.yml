# Dependabot — verificação automática de dependências (atualizações e alertas).
# Abre PRs quando há versões novas ou correções de segurança.
version: 2
updates:
  # Dependências Python do BFF
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"

  # Dependências JavaScript do portal
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    # Ignora atualizações de versão MAIOR (major): elas costumam introduzir
    # mudanças que quebram o build (ex.: Tailwind 4, jsdom 30, React 19).
    # Correções de segurança e updates menores (minor/patch) continuam ativos.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # As próprias GitHub Actions usadas no pipeline
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
